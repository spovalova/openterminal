# Field annotations (PLAN.md section 17): hand-written facts about one field of one route. Key is
# connector:route-glob:field (route globs match across "/"; "*" alone matches everything). Values are field
# config: unit (fraction | percent | ratio | usd | shares | count | days | years | bps), label, format, priority
# (1 shows first and survives the narrowest widget), key (the stat view's headline column), hidden.
#
# A more specific rule wins field by field: "*:*:volume" sets the format, "openbb:equity/price/quote:volume" may
# add a label. The runner converts `fraction` to percent (x100) and stamps the column `percent`, so views and the
# agent never see a fraction. Units were taken from the v1 kind handlers when the seed was written: what they
# multiplied by 100 is a fraction here, what they passed through is not.
#
# Seed coverage: every field the built-in recipes touch on their OpenBB, yahoo and finnhub routes.

annotations:
  # ---------------------------------------------------------------- generic, by field name on any route
  "*:*:symbol": { label: Symbol, priority: 1 }
  "*:*:name": { label: Name, priority: 4 }
  "*:*:exchange": { label: Exchange, priority: 6 }
  "*:*:volume": { unit: shares, format: compact, label: Volume, priority: 3 }
  "*:*:market_cap": { unit: usd, format: compact, label: Mkt cap, priority: 2 }
  "*:*:url": { format: link, label: Link, priority: 9 }
  "*:*:description": { label: Description, priority: 9 }
  "*:*:long_description": { label: Description, priority: 9 }
  "*:*:change_pct": { unit: percent, format: change, label: "Chg %", priority: 2 }
  "*:*:change_percent": { unit: fraction, format: change, label: "Chg %", priority: 2 }
  "*:*:percent_change": { unit: fraction, format: change, label: "Chg %", priority: 2 }
